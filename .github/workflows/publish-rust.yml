name: Publish Rust Crate

on:
  workflow_dispatch:
    inputs:
      cargo_token:
        description: "crates.io API token"
        required: false
        type: string
  release:
    types: [published]

jobs:
  publish-aggregator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aggregator
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo package check
        run: cargo package --allow-dirty
      - name: Publish to crates.io
        if: github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ github.event.inputs.cargo_token }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "cargo_token input not provided; skipping publish."
            exit 0
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
      - name: Release reminder
        if: github.event_name == 'release'
        run: echo "Release created. Use workflow_dispatch with cargo_token to publish crate."
