name: Publish Rust Crates

on:
  workflow_dispatch:
    inputs:
      cargo_token:
        description: "crates.io API token"
        required: false
        type: string
      dry_run:
        description: "Dry-run (package only, no publish)"
        required: false
        default: true
        type: boolean
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        # Publish in dependency order — types first, then libs, then aggregator
        crate:
          - crates/echopose-types
          - crates/echopose-denoise
          - crates/echopose-sync
          - crates/echopose-localize
          - aggregator
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo package check
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || github.event.inputs.cargo_token }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::No cargo token available; skipping publish."
            exit 0
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
