name: Publish Docker Images

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aggregator image
        uses: docker/build-push-action@v6
        with:
          context: aggregator
          file: aggregator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/echopose-aggregator:latest

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: inference
          file: inference/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/echopose-inference:latest
