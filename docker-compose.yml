services:

  aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    image: echopose_aggregator:latest
    ports:
      - "${AGGREGATOR_HTTP_PORT:-3000}:${AGGREGATOR_HTTP_PORT:-3000}"    # HTTP + WebSocket
      - "${AGGREGATOR_UDP_PORT:-5005}:${AGGREGATOR_UDP_PORT:-5005}/udp"   # ESP32 CSI stream
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: echopose_inference:latest
    working_dir: /app
    volumes:
      - ./.env:/app/.env
      - inference-data:/app/data       # persistent session DB and model cache
    command: >
      gunicorn server:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:${INFERENCE_WS_PORT:-8765}
    expose:
      - "${INFERENCE_WS_PORT:-8765}"    # internal only; exposed via inference_gateway
    environment:
      MATTER_HOST: matter-bridge        # reach the matter-bridge service by name
      TRUSTED_PROXIES: "172.16.0.0/12" # trust Docker bridge network for X-Forwarded-For
    env_file:
      - .env
    depends_on:
      - aggregator
    restart: unless-stopped
    profiles: ["default", "standard"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${INFERENCE_WS_PORT:-8765}/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  inference_v2:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: echopose_inference_v2:latest
    working_dir: /app
    volumes:
      - ./.env:/app/.env
      - inference-data:/app/data
    command: >
      gunicorn server_v2:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:${INFERENCE_WS_PORT:-8765}
    expose:
      - "${INFERENCE_WS_PORT:-8765}"
    environment:
      MATTER_HOST: matter-bridge
      TRUSTED_PROXIES: "172.16.0.0/12"
    env_file:
      - .env
    depends_on:
      - aggregator
    restart: unless-stopped
    profiles: ["high-throughput"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${INFERENCE_WS_PORT:-8765}/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  inference_gateway:
    image: nginx:1.27-alpine
    ports:
      - "${INFERENCE_GATEWAY_PORT:-8765}:8765"
    volumes:
      - ./deployment/nginx/inference_gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - inference
    restart: unless-stopped

  # ── Matter protocol bridge ────────────────────────────────────────
  # Exposes EchoPose as a Matter device for Apple Home, Google Home, Alexa.
  # Enable by setting MATTER_ENABLED=true in .env.
  # After first start, visit http://localhost:8765/matter/pairing for the QR code.
  matter-bridge:
    build:
      context: ./matter-bridge
      dockerfile: Dockerfile
    image: echopose_matter_bridge:latest
    ports:
      - "127.0.0.1:${MATTER_HTTP_PORT:-7788}:7788" # HTTP control API — localhost only
      - "${MATTER_PORT:-5540}:5540/udp"             # Matter protocol (UDP — must be reachable on LAN)
    volumes:
      - matter-storage:/app/matter-storage         # persist commissioning data across restarts
    environment:
      MATTER_HTTP_PORT:     "${MATTER_HTTP_PORT:-7788}"
      MATTER_PORT:          "${MATTER_PORT:-5540}"
      MATTER_PASSCODE:      "${MATTER_PASSCODE:-20202021}"
      MATTER_DISCRIMINATOR: "${MATTER_DISCRIMINATOR:-3840}"
      MATTER_STORAGE_DIR:   /app/matter-storage
    restart: unless-stopped
    profiles: ["default", "standard", "high-throughput"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7788/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  matter-storage:
    driver: local
  inference-data:
    driver: local
