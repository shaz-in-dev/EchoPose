[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echopose-sdk"
version = "0.2.2"
description = "WiFi CSI pose estimation toolkit — signal utilities, skeleton ops, evaluation metrics, and bundle streaming"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Muhammed Shazin Sadhik Kunhi Parambath", email = "shazin2889@gmail.com"}
]
license = {text = "MIT"}
keywords = [
  "wifi", "csi", "pose-estimation", "human-sensing", "rf-sensing",
  "channel-state-information", "esp32", "wireless-sensing", "body-tracking"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers"
]
dependencies = [
  "numpy>=1.26.4",
  "scipy>=1.11",
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/shaz-in-dev/EchoPose"
Issues = "https://github.com/shaz-in-dev/EchoPose/issues"

[project.scripts]
echopose-sdk = "echopose_sdk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
