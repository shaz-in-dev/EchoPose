# k8s/echo-pose-deployment.yaml — Enterprise Kubernetes Support (Feature 14)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-pose-aggregator
  labels:
    app: echo-pose
    tier: edge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-pose
  template:
    metadata:
      labels:
        app: echo-pose
    spec:
      containers:
      - name: aggregator
        image: ghcr.io/shaz-in-dev/echopose-aggregator:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo-pose-inference
  labels:
    app: echo-pose
    tier: ml
spec:
  serviceName: echo-pose-inference
  replicas: 1  # Inference is stateful (in-memory WS + globals); scale vertically not horizontally.
               # To scale horizontally, add Redis pub/sub for state sharing first.
  selector:
    matchLabels:
      app: echo-pose
      tier: ml
  template:
    metadata:
      labels:
        app: echo-pose
        tier: ml
    spec:
      containers:
      - name: inference
        image: ghcr.io/shaz-in-dev/echopose-inference:v0.2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # model cache writes are required
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8765
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"  # Automatically requests 1 physical GPU per pod
        env:
        - name: EXPECTED_NODES
          value: "3"
        - name: INFERENCE_DEVICE
          value: "cpu"  # Switch to "cuda" only after building inference/Dockerfile.gpu (nvidia/cuda base)
        livenessProbe:
          httpGet:
            path: /health
            port: 8765
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8765
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 6
          successThreshold: 1

---
# Service for the inference StatefulSet — required for pods to be reachable.
# sessionAffinity: ClientIP ensures a browser always hits the same pod (WebSocket state).
apiVersion: v1
kind: Service
metadata:
  name: echo-pose-inference
  labels:
    app: echo-pose
    tier: ml
spec:
  selector:
    app: echo-pose
    tier: ml
  ports:
  - name: ws
    port: 8765
    targetPort: 8765
  sessionAffinity: ClientIP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-pose-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: echo-pose
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: echo-pose
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8765
  - from: []  # allow external UI connections on 8765
    ports:
    - protocol: TCP
      port: 8765
  egress:
  - {}  # allow all egress (DNS, aggregator, external APIs)

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: echo-pose-aggregator-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: echo-pose
      tier: edge
